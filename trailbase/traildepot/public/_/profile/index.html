<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="/assets/auth-ui-theme.css">
</head>

<body>
  <div class="container">
    <h1>Profile</h1>
    <div id="user-info">
      <p>Loading user information...</p>
    </div>
    <div id="actions">
      <a href="/_/auth/change_password">Change Password</a>
      <a href="/_/auth/change_email">Change Email</a>
      <a href="/_/auth/logout">Logout</a>
    </div>
  </div>
  <script>
    async function loadUserInfo() {
      try {
        const response = await fetch( '/api/auth/v1/me' );
        if ( !response.ok ) {
          document.getElementById( 'user-info' ).innerHTML = '<p>Failed to load user information.</p>';
          return;
        }
        const user = await response.json();
        document.getElementById( 'user-info' ).innerHTML = `
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>User ID:</strong> ${user.id}</p>
        `;
      } catch ( error ) {
        console.error( 'Error loading user info:', error );
        document.getElementById( 'user-info' ).innerHTML = '<p>Failed to load user information.</p>';
      }
    }
    loadUserInfo();
  </script>
</body>

</html>
