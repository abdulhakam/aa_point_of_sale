[package]
name = "tb_ah_run_js"
version = "0.0.0"
authors = ["abdulhakam"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.98"
serde = { version = "^1.0.203", features = ["derive"] }
serde_json = "^1.0.149"
futures = "0.3"
trailbase-wasm = "0.6.1"
rquickjs = { version = "0.11.0", features = ["macro", "futures", "loader"] }
base64 = "0.22"
swc_core = { version = "54.0.0", features = ["ecma_parser", "ecma_codegen", "ecma_transforms_typescript", "common", "ecma_visit", "ecma_ast"] }
minijinja = "2"
# Pinned to the exact version the SDK uses, so there is one wstd in the component.
wstd = "=0.5.6"