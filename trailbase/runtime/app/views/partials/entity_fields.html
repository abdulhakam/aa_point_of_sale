{% macro render(fields) -%}
{% for f in fields -%}
{% if f.type == 'select' -%}
<label class="field"><span>{{ f.label }}</span>
<select name="{{ f.name }}"{% if f.multiple %} multiple size="6"{% endif %}{% if f.required %} required{% endif %}>
{% if not f.multiple %}<option value="">—</option>{% endif %}
{% for o in f.options %}<option value="{{ o.value }}"{% if o.selected %} selected{% endif %}>{{ o.label }}</option>{% endfor %}
</select></label>
{% else -%}
<label class="field"><span>{{ f.label }}</span><input type="{{ f.inputType }}" name="{{ f.name }}" value="{{ f.value }}"{% if f.step %} step="{{ f.step }}"{% endif %}{% if f.required %} required{% endif %}></label>
{% endif -%}
{% endfor -%}
{%- endmacro %}
