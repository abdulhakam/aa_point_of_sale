<header class="topbar">
  <div class="brand">{{ appName }}</div>
  <div class="topbar-meta">
    <form class="job-form" method="post" action="/reports/refresh" data-job-form>
      <button class="job" type="submit" data-job title="Reload the report snapshot: re-read what changed and prepare the reports">
        <span class="job-dot" data-job-dot></span>
        <span class="job-text" data-job-text>idle</span>
      </button>
    </form>
    <div class="clock" data-clock></div>
    <div class="who">
      <span class="who-name">{{ user.name }}</span>
      <form method="post" action="/logout">
        <button class="btn small" type="submit">Logout</button>
      </form>
    </div>
  </div>
</header>
